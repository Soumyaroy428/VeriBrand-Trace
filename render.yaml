services:
  - type: web
    name: veribrand-trace-api
    runtime: python
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: VeriBrand Trace API
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: https://veribrand-trace.vercel.app,http://localhost:3000
      - key: MONGODB_DB_NAME
        value: veribrand_trace
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: VECTOR_STORE_PROVIDER
        value: mongodb_atlas
      - key: PRIVATE_STORAGE_PATH
        value: ./uploads
